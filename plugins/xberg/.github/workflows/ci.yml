name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx --yes --package=alia-app@0.48.1 alia plugin build .
      # A marketplace install omits devDependencies, so the entries must load
      # with production dependencies alone.
      - name: Load entries with production dependencies only
        run: |
          npm ci --omit=dev --ignore-scripts
          node --experimental-strip-types --input-type=module -e 'await import("./host.ts"); await import("./server.ts")'
