name: AliaProbe
options:
  bundleIdPrefix: dev.alia-box
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  AliaProbe:
    type: application
    platform: iOS
    sources: [AliaProbe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.alia-box.probe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AliaProbe
  AliaProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AliaProbeUITests]
    dependencies:
      - target: AliaProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.alia-box.probe.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AliaProbe:
    build:
      targets:
        AliaProbe: all
        AliaProbeUITests: [test]
    test:
      targets: [AliaProbeUITests]
